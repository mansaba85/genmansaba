version: '3.8'

services:
  manu01-merdeka-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manu01_merdeka_app
    restart: unless-stopped
    ports:
      # Port otomatis: Docker/Portainer otomatis memilih port host acak yang kosong (bebas bentrok 100%)
      - "3000"
    volumes:
      # Penyimpanan Database Server Terpusat (Bukan LocalStorage)
      - manu01_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://9router.manubanyuputih.id/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-komoboku}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}

volumes:
  manu01_data:
    driver: local
